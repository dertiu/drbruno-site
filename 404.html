<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Dr. Bruno Thomás Michels</title>
  <script>
    // Endereços digitados com letras trocadas (ex.: /PERICIAS, /Calculadora) vão para a pasta certa.
    (function () {
      var pastas = { pericias: 'pericias', abemid: 'ABEMID', nead: 'nead', calculadoras: 'calculadoras', calculadora: 'calculadoras' };
      var partes = location.pathname.split('/');
      var certa = pastas[(partes[1] || '').toLowerCase()];
      if (!certa || partes[1] === certa) return;
      var resto = partes.slice(2).join('/');
      if (certa === 'pericias' || certa === 'calculadoras') resto = resto.toLowerCase();
      location.replace('/' + certa + '/' + resto + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1b2a; color: #fff; font-family: Lato, system-ui, sans-serif; text-align: center; padding: 16px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-family: Merriweather, Georgia, serif; font-size: 1.4rem; margin: 18px 0 8px; }
    p { color: #c9d2de; margin: 0 0 22px; }
    a { display: inline-block; background: #bfa46f; color: #0d1b2a; font-weight: 700; padding: 11px 20px; border-radius: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="">
    <h1>Página não encontrada</h1>
    <p>Confira o endereço digitado.</p>
    <a href="/">Ir para o site</a>
  </main>
</body>
</html>
