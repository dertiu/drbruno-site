<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08101a">
  <!-- tema: escuro por padrão; aplicado antes de desenhar a tela para não piscar -->
  <script>try { document.documentElement.dataset.tema = localStorage.getItem('pericias_tema') === 'claro' ? 'claro' : 'escuro'; } catch (e) { document.documentElement.dataset.tema = 'escuro'; }</script>
  <title>Perícias | Dr. Bruno Thomás Michels</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo-192.png">
  <link rel="apple-touch-icon" href="logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fontes sem travar o primeiro desenho da tela -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet"></noscript>
  <!-- ao publicar mudanças, aumente o número de "v" nos 3 arquivos abaixo para o navegador baixar a versão nova -->
  <link rel="stylesheet" href="app.css?v=24">
</head>
<body>

<!-- LOGIN -->
<main id="tela-login" class="login" hidden>
  <form id="form-login" class="login-card" autocomplete="on">
    <img src="logo-128.webp" alt="Logo" class="login-logo" width="58" height="56">
    <h1>Perícias</h1>
    <p class="login-sub">Dr. Bruno Thomás Michels</p>
    <label for="lg-user">Usuário</label>
    <input id="lg-user" name="username" autocomplete="username" autocapitalize="none" required>
    <label for="lg-pass">Senha</label>
    <input id="lg-pass" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primario" type="submit" id="lg-btn">Entrar</button>
    <p id="lg-msg" class="msg" role="alert"></p>
  </form>
</main>

<!-- APP -->
<div id="tela-app" class="app" hidden>
  <nav class="nav" aria-label="Seções">
    <div class="marca"><img src="logo-128.webp" alt="" width="38" height="38"><div><b>Perícias</b><small>Dr. Bruno Michels</small></div></div>
    <div id="nav-itens" class="nav-itens"></div>
    <div id="nav-mais" class="nav-mais" hidden></div>
    <button type="button" class="btn-tema" id="btn-tema" data-acao="tema"></button>
    <div class="nav-rodape"><span id="nav-user"></span><button type="button" class="link-sair" id="btn-sair">Sair</button></div>
  </nav>
  <div class="principal">
    <header class="topo">
      <h1 id="titulo">Painel</h1>
      <span id="sync" class="sync"></span>
      <label class="busca-global"><span class="sr">Buscar</span><input type="search" id="busca-global" placeholder="Buscar processo, parte, cidade..." autocomplete="off"></label>
      <button type="button" class="btn icone" id="btn-atualizar" title="Atualizar dados" aria-label="Atualizar dados"></button>
      <button type="button" class="btn ouro" id="btn-novo">+ Novo</button>
      <button type="button" class="btn icone so-celular" id="btn-sair-m" title="Sair" aria-label="Sair"></button>
    </header>
    <main id="conteudo" class="conteudo"></main>
  </div>
</div>

<!-- FICHA DO PROCESSO -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-bg" data-acao="fechar-ficha"></div>
  <section class="drawer-painel" role="dialog" aria-modal="true" aria-labelledby="ficha-nome" id="ficha"></section>
</div>

<!-- MODAL -->
<dialog id="modal">
  <form method="dialog" id="modal-form" class="modal-card">
    <div class="modal-topo">
      <h2 id="modal-titulo"></h2>
      <button type="button" class="btn pequeno" id="modal-fechar">Fechar</button>
    </div>
    <div id="modal-corpo" class="modal-corpo"></div>
    <div id="modal-rodape" class="modal-rodape"></div>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="config.js?v=24"></script>
<script src="app.js?v=24"></script>
</body>
</html>
