<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dr. Bruno Thomás Michels | Site em manutenção</title>
  <meta name="description" content="Site em manutenção. Acesso às calculadoras de plantão.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0d1b2a;--bg2:#162538;--gold:#bfa46f;--light:#f2f2f2;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{
      font-family:'Lato',sans-serif;
      background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%);
      color:var(--light);
      display:flex;align-items:center;justify-content:center;
      padding:2rem 1.25rem;text-align:center;
    }
    main{max-width:460px;width:100%;}
    .logo{width:120px;height:auto;margin-bottom:2rem;border-radius:14px;}
    h1{
      font-family:'Merriweather',serif;
      font-size:clamp(1.5rem,5vw,2rem);
      color:var(--gold);margin-bottom:.9rem;
    }
    p{opacity:.8;line-height:1.6;margin-bottom:2.2rem;}
    .btn{
      display:inline-flex;align-items:center;gap:.6rem;
      padding:1rem 2rem;border-radius:6px;
      background:var(--gold);color:#000;
      font-weight:700;font-size:1.05rem;text-decoration:none;
      transition:transform .2s ease,opacity .2s ease;
    }
    .btn:hover{opacity:.9;transform:translateY(-2px);}
    .btn svg{width:20px;height:20px;}
    footer{margin-top:3rem;font-size:.8rem;opacity:.45;}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Dr. Bruno Thomás Michels">
    <h1>Site em manutenção</h1>
    <p>Estamos preparando novidades. Em breve a página estará de volta.</p>
    <a class="btn" href="/calculadoras/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="19"/><line x1="8" y1="19" x2="12" y2="19"/></svg>
      Acessar calculadoras
    </a>
    <footer>&copy; <span id="year"></span> Dr. Bruno Thomás Michels · CRM‑SP 245235</footer>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
